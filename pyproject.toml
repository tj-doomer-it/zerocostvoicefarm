[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocostvoicefarm"
version = "0.2.0"
description = "The headless, zero-cost video dubbing engine for AI agents and creator pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Thomas James-Worrall"}
]
keywords = ["voice-cloning", "dubbing", "whisper", "xtts", "ffmpeg", "subtitles", "mcp", "ai-agents", "claude-code"]
dependencies = [
    "TTS>=0.22.0",
    "transformers>=4.36.0,<4.40.0",
    "torch",
    "torchaudio",
    "soundfile",
    "scipy",
    "numpy",
    "openai-whisper",
    "click>=8.0.0",
    "rich>=12.0.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
voicefarm = "zerocostvoicefarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
